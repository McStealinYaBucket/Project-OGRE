# reccmp targets. Original paths live in reccmp-user.yml (gitignored), recompiled paths in
# <build>/reccmp-build.yml (written by CMake). Data sources are generated by tools/ida/gen_reccmp_csv.py.
targets:
  PLAYER:
    filename: RobloxPlayerBeta.exe
    source-root:
      - Client
    hash:
      sha256: 326d9c3e3baa18e9a6bdd6e3187ee1a1d2eddbaecf87c57b9e35da8c6857b10d
    report:
      # The original's entry point is VMProtect's loader in .vmp1 (0x00ee050a). reccmp pairs entry
      # points automatically, which compares our WinMainCRTStartup against it: not a real pair.
      ignore-functions:
        - WinMainCRTStartup
    data-sources:
      - reccmp/player-function-size.csv
      - reccmp/player-imports.csv
      - reccmp/player-crt.csv
      - reccmp/player-stl.csv
      - reccmp/player-atl.csv
      - reccmp/player-symbols.csv
      - reccmp/player-lua.csv
      - reccmp/player-raknet.csv
      - reccmp/player-g3d.csv
      - reccmp/player-zlib.csv
      - reccmp/player-libzip.csv
      - reccmp/player-boost.csv
      - reccmp/player-libdata.csv
  STUDIO:
    filename: RobloxStudioBeta.exe
    source-root:
      - Client
    hash:
      sha256: 68ba1c5fd39ccc535b6ed77a171e3c94fd6d258fd8a5777af428dbbf9b623ba6
    data-sources:
      - reccmp/studio-function-size.csv
      - reccmp/studio-crt.csv
      - reccmp/studio-stl.csv
      - reccmp/studio-atl.csv
      - reccmp/studio-symbols.csv
      - reccmp/studio-lua.csv
      - reccmp/studio-raknet.csv
      - reccmp/studio-g3d.csv
      - reccmp/studio-zlib.csv
      - reccmp/studio-libzip.csv
      - reccmp/studio-boost.csv
      - reccmp/studio-libdata.csv
